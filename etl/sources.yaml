# Registo legível por máquina das fontes. Espelha docs/fontes.md.
# Gera data/processed/fontes.json, contra o qual todos os outros ficheiros validam.
#
# verificacao: PRIM = conteúdo lido na fonte primária | DESC = original descarregado
# e com sha256, conteúdo por ler | URL-S / EXIST-S / CONHEC = por confirmar.
# Ver docs/fontes.md para a legenda completa.
#
# Uma fonte com `descoberta` é uma página-índice, não o documento: o pipeline
# extrai dela os URL dos ficheiros reais e escreve as fontes-filhas em
# etl/descobertas.yaml. Ver a docstring de etl/common/descoberta.py.

S01:
  nome: Executivo Municipal
  entidade: Município de Guimarães
  url: https://www.cm-guimaraes.pt/municipio/camara-municipal/executivo-municipal
  formato: html
  periodicidade: por_mandato
  verificacao: PRIM
  alimenta: [executivo.json]
  limitacoes: Pelouros em prosa, nao tabelados. Nao traz votos nem mandatos.

S05:
  nome: Orgânica dos Serviços Municipais 2023 (DR 2.ª série n.º 251, 30-12-2022)
  entidade: Município de Guimarães
  url: https://www.cm-guimaraes.pt/cmguimaraes/uploads/writer_file/document/9902/organica_2023.pdf
  formato: pdf
  ano_referencia: 2023
  periodicidade: irregular
  verificacao: DESC
  alimenta: [estrutura_organica.json]
  limitacoes: Alterado pelo Despacho 9070/2024 (S06) - aplicar antes de publicar.

S07:
  nome: Mapa de Pessoal (índice)
  entidade: Município de Guimarães
  url: https://www.cm-guimaraes.pt/areas-de-intervencao/educacao-e-recursos-humanos/recursos-humanos/mapa-de-pessoal
  formato: html
  periodicidade: anual
  verificacao: PRIM
  limitacoes: Pagina indice; os PDF anuais sao descobertos a partir daqui.
  descoberta:
    padrao: '/cmguimaraes/uploads/document/file/\d+/mapa_de_pessoal_(?P<ano>\d{4})\.pdf'
    id: 'S07-{ano}'
    nome: 'Mapa de Pessoal {ano}'
    formato: pdf
    alimenta: ['mapa_pessoal.json']
    limitacoes: Tabela larga em PDF; risco de digitalizado (OCR). So agregados (regra 7).

S10:
  nome: Relatório e Contas 2021
  entidade: Município de Guimarães
  url: https://www.cm-guimaraes.pt/cmguimaraes/uploads/document/file/18944/relatorio_e_contas_2021.pdf
  formato: pdf
  ano_referencia: 2021
  periodicidade: anual
  verificacao: DESC
  alimenta: [orcamento.json]

S11:
  nome: Consolidação de Contas 2023
  entidade: Município de Guimarães
  url: https://www.cm-guimaraes.pt/cmguimaraes/uploads/document/file/21681/consolidacao_de_contas_2023.pdf
  formato: pdf
  ano_referencia: 2023
  periodicidade: anual
  verificacao: DESC
  alimenta: [empresas_municipais.json]
  limitacoes: Fonte do perimetro de consolidacao; resolve os NIF para o ETL de contratos.

S16:
  nome: Mapa oficial dos resultados das eleições autárquicas 2025 (notícia CMG)
  entidade: Município de Guimarães
  url: https://www.cm-guimaraes.pt/noticias/noticia/mapa-oficial-dos-resultados-das-eleicoes-autarquicas
  formato: html
  ano_referencia: 2025
  periodicidade: por_eleicao
  verificacao: PRIM
  limitacoes: >-
    Noticia, nao o documento. Remete para o Mapa Oficial n.o 2-B/2025, publicado
    em DR de 17-12-2025 e aprovado pela CNE em 16-12-2025 - esse e que tem valor
    legal para a regra 5, e e descoberto a partir daqui.
  descoberta:
    padrao: 'https://files\.diariodarepublica\.pt/[^"\s]+\.pdf'
    id: 'S16-DRE'
    nome: Mapa Oficial n.º 2-B/2025 (DR 1.ª série, 17-12-2025)
    formato: pdf
    ano_referencia: 2025
    alimenta: ['orgaos_eleitos.json']
    limitacoes: >-
      Documento nacional (~143 MB) e DIGITALIZADO: as paginas 3+ sao imagens sem
      camada de texto, logo exige OCR (L17). Os resultados da Camara vieram de S02;
      isto fica como fonte com valor legal, por confirmar.

S23:
  nome: Contratos Públicos - Portal BASE (IMPIC), via dados.gov.pt (índice)
  entidade: IMPIC / AMA
  url: https://dados.gov.pt/pt/datasets/contratos-publicos-portal-base-impic-contratos-de-2012-a-2026/
  formato: html
  periodicidade: semanal
  verificacao: PRIM
  limitacoes: >-
    Pagina do dataset. Os ficheiros sao um XLSX por ano e o URL inclui um carimbo
    temporal que roda a cada publicacao semanal - por isso sao descobertos, nao fixados.
  descoberta:
    padrao: 'https://dados\.gov\.pt/s/resources/[^"\s\\]+/contratos(?P<ano>\d{4})\.xlsx'
    id: 'S23-{ano}'
    nome: 'Contratos públicos BASE/IMPIC - {ano}'
    formato: xlsx
    periodicidade: semanal
    alimenta: ['contratos_{ano}.json']
    ano_minimo: 2019
    limitacoes: >-
      Dataset nacional. Filtrar pelos NIF do adjudicante resolvidos a partir do
      perimetro de consolidacao (S11). Desfasamento ate 7 dias.

S27:
  nome: Portal Autárquico - finanças locais
  entidade: DGAL
  url: https://portalautarquico.dgal.gov.pt/
  formato: xlsx
  periodicidade: trimestral
  verificacao: URL-S
  alimenta: [comparacao.json]
  limitacoes: >-
    Series ja normalizadas entre municipios - unica base admissivel para comparar.
    Servem certificado *.dgal.gov.pt, que nao cobre www.portalautarquico.dgal.gov.pt:
    usar o host sem www. O URL exato dos quadros ainda nao esta localizado (L13).

S32:
  nome: >-
    INE - Populacao residente por Local de residencia (NUTS 2024), Sexo e Grupo
    etario; Anual (Estimativas anuais da populacao residente, indicador 0012918)
  entidade: INE
  url: https://www.ine.pt/ine/json_indicador/pindica.jsp?op=2&varcd=0012918&Dim1=S7A2021,S7A2022,S7A2023,S7A2024,S7A2025&lang=PT
  url_metadados: https://www.ine.pt/ine/json_indicador/pindicaMeta.jsp?varcd=0012918&lang=PT
  formato: json
  periodicidade: anual
  verificacao: PRIM
  alimenta: [populacao.json]
  limitacoes: >-
    Denominador de TODAS as metricas per capita, por isso V7 exige uma unica serie.
    Confirmado: desce ao municipio (Guimaraes = geocod 1190308) e cobre 2021-2025.
    Sem Dim1 a API devolve so o ultimo ano, dai a lista de periodos no URL.
    O indicador NUTS 2013 (0008273) cobre 2011-2023 e daria mais historia, mas
    perdia 2024 e 2025 - para um dashboard ao cidadao a recencia vale mais.
    MISTURAR AS DUAS SERIES VIOLA A V7: trocar de indicador implica trocar a serie
    toda. Alternativas: 0012903/0012905 (NUTS 2024, por idade simples),
    0008273/0007307 (NUTS 2013), 0003182 (NUTS 2002).
    A API rejeita HEAD (o check-acesso usa GET) e e intolerante a cadencia:
    um 429 chega para bloquear o host inteiro durante horas.

S02:
  nome: Câmara Municipal (composição e resultados eleitorais)
  entidade: Município de Guimarães
  url: https://www.cm-guimaraes.pt/municipio/camara-municipal
  formato: html
  ano_referencia: 2025
  periodicidade: por_mandato
  verificacao: PRIM
  alimenta: [orgaos_eleitos.json, executivo.json]
  limitacoes: >-
    Unica fonte obtida com percentagens e mandatos por forca politica. So lista as
    forcas COM mandato (45,33+37,50+8,06 = 90,89%): os ~9% restantes nao estao
    discriminados. NAO traz votos absolutos nem abstencao. Lista os 11 vereadores
    e e a referencia para o cruzamento com S01.

S17:
  nome: Resultados finais homologados das eleições autárquicas 2025
  entidade: Município de Guimarães
  url: https://www.cm-guimaraes.pt/areas-de-intervencao/noticia/resultados-finais-homologados-das-ultimas-eleicoes-autarquicas
  formato: html
  ano_referencia: 2025
  periodicidade: por_eleicao
  verificacao: PRIM
  limitacoes: >-
    Noticia de 16-10-2025. Aponta para o Edital de Apuramento Geral (homologado a
    15-10-2025 pela juiza presidente da Assembleia de Apuramento Geral), que seria
    a fonte local com valor legal - mas o URL publicado devolve 404 (ver L15).

S37:
  nome: Assembleia Municipal (composição do órgão)
  entidade: Município de Guimarães
  url: https://www.cm-guimaraes.pt/municipio/assembleia-municipal
  formato: html
  periodicidade: por_mandato
  verificacao: PRIM
  alimenta: [orgaos_eleitos.json]
  limitacoes: >-
    Da a dimensao do orgao (111 membros: 56 eleitos diretamente + 55 presidentes
    de junta) mas NAO a distribuicao por forca politica nem os nomes (L16).

S04:
  nome: Estrutura e Organização dos Serviços Municipais (índice)
  entidade: Município de Guimarães
  url: https://www.cm-guimaraes.pt/noticia-6/estrutura-e-organizacao-dos-servicos-municipais
  formato: html
  periodicidade: irregular
  verificacao: PRIM
  limitacoes: >-
    Pagina da CMG que remete para o texto normativo no DR. E daqui que se descobre
    o Despacho 9070/2024 (S06), obrigatorio para nao publicar um organograma errado.
  descoberta:
    padrao: 'https://files\.diariodarepublica\.pt/[^"\s]+\.pdf'
    id: 'S06'
    nome: Despacho n.º 9070/2024 (DR 2.ª série n.º 154, 09-08-2024)
    formato: pdf
    ano_referencia: 2024
    alimenta: ['estrutura_organica.json']
    limitacoes: >-
      Altera os artigos 5.o, 30.o e 31.o da estrutura aprovada pelo Despacho
      14897/2022 (S05), reorganizando os Departamentos de Intervencao Social e de
      Recursos Humanos. Tem de ser aplicado SOBRE S05 - usar so S05 da um
      organograma errado (L5). Texto normativo, preferivel a imagem do organograma.

S03:
  nome: Organograma (índice)
  entidade: Município de Guimarães
  url: https://www.cm-guimaraes.pt/municipio/camara-municipal/organograma
  formato: html
  periodicidade: irregular
  verificacao: PRIM
  limitacoes: >-
    Pagina indice. O organograma e imagem/diagrama: serve de verificacao cruzada
    ao texto normativo (S05+S06), nunca de fonte primaria da hierarquia (L4).
  descoberta:
    padrao: '/cmguimaraes/uploads/writer_file/document/\d+/organograma_(?P<ver>[\w]+)\.pdf'
    id: 'S03-{ver}'
    nome: 'Organograma {ver}'
    formato: pdf
    alimenta: ['estrutura_organica.json']
    limitacoes: Diagrama. Conferir contra S05+S06, que sao o texto com valor legal.

S38:
  nome: Despacho n.º 6751/2024 (DR 2.ª série n.º 115, 17-06-2024)
  entidade: Município de Guimarães / INCM
  url: https://files.diariodarepublica.pt/2s/2024/06/115000000/0021500223.pdf
  formato: pdf
  ano_referencia: 2024
  periodicidade: irregular
  verificacao: PRIM
  alimenta: [estrutura_organica.json]
  limitacoes: >-
    ALTERACAO INTERMEDIA, indispensavel e que NAO esta ligada em nenhuma pagina da
    CMG. Cria o Departamento de Inovacao, Transformacao Digital e Economia (DITDE)
    e renomeia o Departamento de Cultura, Economia e Inovacao para Departamento de
    Cultura e Turismo. Altera os artigos 3.o, 4.o, 5.o, 10.o e 62.o.
    A cadeia correta e S05 (14897/2022) -> S38 (6751/2024) -> S06 (9070/2024).
    Sem S38 falta um departamento inteiro e a numeracao das alineas do artigo 5.o
    nao bate com a do S06 (ver L22).


  verificacao: PRIM
  limitacoes: >-
    Indice do arquivo financeiro, alcancado a partir do ponto "8.1 Documentos
    previsionais" do Indice de Transparencia Municipal (S14). Arvore de pastas
    ano -> tipo (Previsionais / Prestacao de Contas / Impostos Locais) com ids
    opacos e paginacao, por isso NAO e' varrivel por uma so regra de descoberta.
    E' daqui que saem S08-2021..S08-2026 e a serie de Relatorios e Contas.
